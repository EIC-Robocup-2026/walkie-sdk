[project]
name = "walkie-sdk"
version = "0.2.0"
description = "Python SDK for controlling Walkie robots via WebSocket (ROSBridge) and Zenoh"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Walkie Team"}
]
keywords = ["robotics", "ros2", "sdk", "rosbridge", "zenoh", "navigation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.3.5",
    "opencv-python>=4.11.0.86",
    "roslibpy>=2.0.0",
    "pyyaml",
    "eclipse-zenoh>=1.7.2",
    "zenoh-ros2-sdk",
    "rosbags",
]

[project.urls]
Homepage = "https://github.com/EIC-Robocup-2026/walkie-sdk"
Documentation = "https://github.com/EIC-Robocup-2026/walkie-sdk#readme"

[project.scripts]
walkie-web = "walkie_sdk.web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["walkie_sdk"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
]
yolo = [
    "ultralytics>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
