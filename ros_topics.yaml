# ros_topics.yaml

CAMERA_TOPICS:
  head: "/zed_head/zed_node/rgb/color/rect/image"
  left: "/walkie/camera/left"
  right: "/walkie/camera/right"
  default: "walkie/camera/image"

# Depth streams (sensor_msgs/msg/Image). Read via bot.camera.get_depth()
# (zenoh camera streams these automatically). ZED head publishes 32FC1 (metres).
DEPTH_TOPICS:
  head: "/zed_head/zed_node/depth/depth_registered"

# Intrinsics (sensor_msgs/msg/CameraInfo). Read via bot.camera.get_camera_info()
# or bot.camera.get_intrinsics(). depth_registered is aligned to the left
# rectified image, so the same intrinsics apply to colour and depth.
CAMERA_INFO_TOPICS:
  head: "/zed_head/zed_node/rgb/color/rect/camera_info"
# Point cloud streams (sensor_msgs/msg/PointCloud2). Read via bot.point_cloud.get_once().
POINT_CLOUD_TOPICS:
  head: "/zed_head/zed_node/point_cloud/cloud_registered/filtered_map"

ARM_TOPICS:
  states: "joint_states"
  states_type: "sensor_msgs/msg/JointState"
  jtc_left: "left_joint_trajectory_controller/joint_trajectory"
  jtc_right: "right_joint_trajectory_controller/joint_trajectory"
  jtc_type: "trajectory_msgs/msg/JointTrajectory"

ARM_ACTIONS:
  interface: "my_robot_interfaces/action"
  go_to_pose: "go_to_pose"
  go_to_pose_quat: "go_to_pose_quat"
  go_to_pose_relative: "go_to_pose_relative"
  go_to_home: "go_to_home"
  control_gripper: "control_gripper"
  set_joint_position: "set_joint_position"

ARM_SERVICES:
  get_ee_pose: "get_ee_pose"
  get_ee_pose_type: "my_robot_interfaces/srv/GetEEPose"
  get_joint_states: "get_joint_states"
  get_joint_states_type: "my_robot_interfaces/srv/GetJointStates"

NAV_TOPICS:
  cmd_vel: "cmd_vel_controller"
  cmd_vel_type: "geometry_msgs/msg/TwistStamped"

NAV_ACTIONS:
  navigate_to_pose: "navigate_to_pose"
  navigate_to_pose_type: "nav2_msgs/action/NavigateToPose"

TELEMETRY_TOPICS:
  odom: "current_pose"
  odom_type: "nav_msgs/msg/Odometry"

VIZ_TOPICS:
  markers: "walkie/viz_markers"
  markers_array: "walkie/viz_markers_array"
  target_pose: "walkie/target_pose"
  markers_type: "visualization_msgs/msg/Marker"
  markers_array_type: "visualization_msgs/msg/MarkerArray"
  target_pose_type: "geometry_msgs/msg/PoseStamped"

OB_POSE_SERVICE:
  service_name: "get_3d_poses"
  service_type: "walkie_perception/srv/GetObPose"
